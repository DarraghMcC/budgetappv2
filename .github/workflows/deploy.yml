name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy-hosting:
    name: Build & deploy PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify required secrets
        run: |
          missing=""
          [ -z "$VITE_GOOGLE_CLIENT_ID" ]     && missing="$missing VITE_GOOGLE_CLIENT_ID"
          [ -z "$VITE_GOOGLE_CLIENT_SECRET" ] && missing="$missing VITE_GOOGLE_CLIENT_SECRET"
          [ -z "$VITE_SHEET_ID" ]             && missing="$missing VITE_SHEET_ID"
          [ -z "$VITE_SYNC_URL" ]             && missing="$missing VITE_SYNC_URL"
          [ -z "$VITE_SYNC_SECRET" ]          && missing="$missing VITE_SYNC_SECRET"
          if [ -n "$missing" ]; then
            echo "ERROR: missing required secrets:$missing"
            exit 1
          fi
          echo "All secrets present."
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_SHEET_ID: ${{ secrets.VITE_SHEET_ID }}
          VITE_SYNC_URL: ${{ secrets.VITE_SYNC_URL }}
          VITE_SYNC_SECRET: ${{ secrets.VITE_SYNC_SECRET }}

      - name: Build PWA
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_SHEET_ID: ${{ secrets.VITE_SHEET_ID }}
          VITE_SYNC_URL: ${{ secrets.VITE_SYNC_URL }}
          VITE_SYNC_SECRET: ${{ secrets.VITE_SYNC_SECRET }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUDGETAPPV2_B7275 }}' > "$RUNNER_TEMP/sa.json"
          output=$(firebase deploy --only hosting --project budgetappv2-b7275 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ] && echo "$output" | grep -q "is the current active version"; then
            echo "Already the active version — skipping."
            exit 0
          fi
          exit $code
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

  deploy-functions:
    name: Deploy Firebase Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Deploy functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --project budgetappv2-b7275
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUDGETAPPV2_B7275 }}
