name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy-hosting:
    name: Build & deploy PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build PWA
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_SHEET_ID: ${{ secrets.VITE_SHEET_ID }}
          VITE_SYNC_URL: ${{ secrets.VITE_SYNC_URL }}
          VITE_SYNC_SECRET: ${{ secrets.VITE_SYNC_SECRET }}

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project budgetappv2-b7275
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUDGETAPPV2_B7275 }}

  deploy-functions:
    name: Deploy Firebase Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Deploy functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --project budgetappv2-b7275
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUDGETAPPV2_B7275 }}
